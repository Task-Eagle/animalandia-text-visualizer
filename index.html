<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animalandia: Space Markdown Visualizer</title>
    <!-- Load the 'marked' library for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- Global Styles --- */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            font-family: 'Arial', sans-serif;
            /* Fallback color in case the background div fails */
            background-color: #050510; 
            color: white;
            /* Ensure no scrollbars from the body itself */
            overflow-y: auto;
        }

        /* --- Space Background & Particles --- */
        #space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Behind everything */
            overflow: hidden;
            background-color: #050510; /* Explicit fallback */
        }

        .particle {
            position: absolute;
            top: -50px; /* Start slightly above screen */
            opacity: 0; /* Start invisible for smooth fade-in */
            pointer-events: none;
            animation: zoom linear infinite;
            /* Ensure they are visible */
            will-change: transform, opacity;
        }

        @keyframes zoom {
            0% {
                transform: translateY(0) scale(0.1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) scale(1.5);
                opacity: 0;
            }
        }

        .star {
            background: white;
            border-radius: 2px;
            box-shadow: 0 0 5px white;
        }

        .letter {
            color: #aaddff;
            font-weight: bold;
            font-size: 1.5rem;
            text-shadow: 0 0 8px #aaddff;
            font-family: 'Courier New', monospace;
        }

        /* --- Content Container --- */
        .content {
            position: relative;
            z-index: 1; /* Must be higher than -1 */
            padding: 40px;
            max-width: 900px;
            margin: 50px auto;
            /* Glass effect */
            background: rgba(0, 0, 0, 0.65);
            border-radius: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* --- Markdown Visualizer Styles --- */
        .visualizer-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .editor-pane, .preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .pane-label {
            font-size: 0.9rem;
            color: #aaddff;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            resize: vertical;
            box-sizing: hard-box;
        }

        textarea:focus {
            outline: none;
            border-color: #aaddff;
            background: rgba(255, 255, 255, 0.15);
        }

        #output {
            width: 100%;
            height: 300px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            overflow-y: auto;
            box-sizing: border-box;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .visualizer-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- The Space Background -->
    <div id="space-background"></div>

    <!-- Main Content -->
    <div class="content">
        <h1>🦁 Animalandia Text Visualizer</h1>
        <p style="text-align: center; color: #ccc;">
            Type Markdown on the left, see the magic on the right.
        </p>

        <div class="visualizer-container">
            <div class="editor-pane">
                <div class="pane-label">Markdown Input</div>
                <textarea id="input" placeholder="# Hello World
**Bold** and *italic* text.

- Star
- List
- Items"></textarea>
            </div>
            
            <div class="preview-pane">
                <div class="pane-label">Live Preview</div>
                <div id="output"></div>
            </div>
        </div>
        
        <p style="text-align: center; margin-top: 30px; font-style: italic; opacity: 0.7;">
            (Keep scrolling... the stars never stop!)
        </p>
    </div>

    <script>
        // --- Markdown Logic ---
        const inputArea = document.getElementById('input');
        const outputArea = document.getElementById('output');

        function renderMarkdown() {
            const rawText = inputArea.value;
            // Check if marked is loaded
            if (typeof marked !== 'undefined') {
                const htmlContent = marked.parse(rawText);
                outputArea.innerHTML = htmlContent;
            } else {
                outputArea.innerHTML = "<p style='color:red'>Error: Marked library not loaded.</p>";
            }
        }

        // Initial render
        renderMarkdown();
        inputArea.addEventListener('input', renderMarkdown);

        // --- Space Background Logic ---
        const particleCount = 100;
        const container = document.getElementById('space-background');
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        function createParticle() {
            // Safety check: ensure container exists
            if (!container) return;

            const particle = document.createElement('div');
            particle.classList.add('particle');

            // 70% chance of star, 30% letter
            const isStar = Math.random() > 0.3;

            if (isStar) {
                particle.classList.add('star');
                const length = Math.random() * 50 + 10; 
                particle.style.width = length + 'px';
                particle.style.height = '2px';
            } else {
                particle.classList.add('letter');
                particle.innerText = letters.charAt(Math.floor(Math.random() * letters.length));
                particle.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            }

            particle.style.left = Math.random() * 100 + '%';
            
            // Speed between 1s and 4s
            const duration = Math.random() * 3 + 1; 
            particle.style.animationDuration = duration + 's';
            
            // Random delay
            particle.style.animationDelay = Math.random() * 5 + 's';

            container.appendChild(particle);
        }

        // Wait for DOM to be fully ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                // Small timeout to ensure CSS is parsed
                setTimeout(() => {
                    for (let i = 0; i < particleCount; i++) {
                        createParticle();
                    }
                }, 100);
            });
        } else {
            // If already loaded, still wait a tiny bit for CSS
            setTimeout(() => {
                for (let i = 0; i < particleCount; i++) {
                    createParticle();
                }
            }, 100);
        }
    </script>
</body>
</html>
